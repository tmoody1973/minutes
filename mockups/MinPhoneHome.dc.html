<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minutes · This week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F4}
a{color:#1F56C2}a:hover{color:#10203A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7F4; color: #10203A; font-family: 'Public Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 16px 16px 12px 16px; background: #FFFFFF; border-bottom: 1px solid #DCDFE5; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Minutes</span>
<span style="font-size: 13px; color: #5B6577">Week of [Oct 26]</span>
</div>
<button type="button" style="align-self: flex-start; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #DCDFE5; background: #F7F7F4; color: #10203A; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
[Your address] · District [N] · Ald. [Name]</button>
</header>

<main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

<section aria-label="This week at City Hall" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">This week at City Hall</h1>
<span style="font-size: 13px; color: #5B6577">5 things</span>
</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<a href="{{it.href}}" style="text-decoration: none; color: #10203A; background: #FFFFFF; border: 1px solid #DCDFE5; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start">
<span style="width: 8px; height: 8px; margin-top: 7px; flex: none; border-radius: 50%; background: {{it.dot}}"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font: 600 10px 'IBM Plex Mono', monospace; letter-spacing: 0.06em; color: #5B6577">{{it.tag}}</span>
<span style="font-weight: 700; font-size: 15px; line-height: 1.35">{{it.title}}</span>
</span>
</a>
</sc-for>
</section>

</main>

<section aria-label="Ask" style="flex: none; padding: 10px 16px; background: #FFFFFF; border-top: 1px solid #DCDFE5; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{listening}}" hint-placeholder-val="{{false}}">
<div aria-live="polite" style="padding: 10px 12px; border-radius: 12px; background: #E8EFFC; display: flex; flex-direction: column; gap: 4px">
<span style="font: 600 10px 'IBM Plex Mono', monospace; letter-spacing: 0.06em; color: #1F56C2">LISTENING · ENGLISH OR ESPAÑOL</span>
<span style="font-size: 15px; font-weight: 600">"What's happening with the empty lot on [street]?"</span>
</div>
</sc-if>
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex: 1; font-size: 15px; color: #5B6577">Ask about City Hall, by voice</span>
<button type="button" onClick="{{toggle}}" aria-pressed="{{pressed}}" aria-label="{{micLabel}}" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: {{micBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
</div>
</section>

<nav aria-label="Main" style="height: 64px; flex: none; display: flex; background: #FFFFFF; border-top: 1px solid #DCDFE5">
<a href="MinPhoneHome.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #1F56C2; font-size: 11px; font-weight: 700">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg>
This week</a>
<a href="MinPhoneTracker.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #10203A; font-size: 11px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
Near me</a>
<a href="MinPhoneMeeting.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #10203A; font-size: 11px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"></rect><path d="M10 9l5 2.5-5 2.5z"></path></svg>
Meetings</a>
<a href="#following" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #10203A; font-size: 11px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
Following</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = !!this.state.listening;
    const items = [
      { tag: 'NEAR YOU · DEVELOPMENT', title: 'Apartment proposal at [address] heads to committee [Nov 10]', dot: '#B86500', href: 'MinPhoneTracker.dc.html' },
      { tag: 'PLAN COMMISSION · DECIDED', title: '[3] items recommended, [1] held to [Nov 16]', dot: '#1F56C2', href: 'MinPhoneMeeting.dc.html' },
      { tag: 'YOUR ALDERPERSON', title: 'Ald. [Name] introduced a resolution on [topic]', dot: '#1F56C2', href: '#file' },
      { tag: 'COMMON COUNCIL', title: '[Topic] ordinance passed, [vote]', dot: '#9AA3B2', href: '#file' },
      { tag: 'COMING UP', title: 'Public hearing on [topic], [Thu, Nov 5]', dot: '#B86500', href: '#hearing' }
    ];
    return {
      items,
      listening: on,
      toggle: () => this.setState({ listening: !on }),
      pressed: on ? 'true' : 'false',
      micLabel: on ? 'Stop listening' : 'Ask by voice',
      micBg: on ? '#10203A' : '#1F56C2'
    };
  }
}
</script>
</body>
</html>
